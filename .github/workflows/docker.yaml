name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-24.04
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: 清理原有配置中不需要的软件
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /opt/ghc

    - name: 检查磁盘布局
      id: disk
      run: |
        set -euo pipefail
        root_device=$(stat -c %d /)
        storage_driver=$(docker info --format '{{.Driver}}')
        if [[ ! "$root_device" =~ ^[0-9]+$ ]]; then
          echo "::error::无法识别根文件系统，停止运行"
          exit 1
        fi
        maximize=false
        if [[ -d /mnt ]]; then
          temp_device=$(stat -c %d /mnt)
          if [[ ! "$temp_device" =~ ^[0-9]+$ ]]; then
            echo "::error::无法识别临时文件系统，停止运行"
            exit 1
          fi
          if [[ "$root_device" != "$temp_device" && "$storage_driver" == overlay2 ]]; then
            temp_type=$(findmnt -n -o FSTYPE --target /mnt)
            if [[ "$temp_type" == ext4 || "$temp_type" == xfs ]]; then
              root_free_kb=$(df -k --output=avail / | awk 'NR == 2 {print $1}')
              temp_free_kb=$(df -k --output=avail /mnt | awk 'NR == 2 {print $1}')
              if [[ ! "$root_free_kb" =~ ^[0-9]+$ || ! "$temp_free_kb" =~ ^[0-9]+$ ]]; then
                echo "::error::无法读取磁盘可用空间，停止运行"
                exit 1
              fi
              # 根分区预留 8 GiB，临时分区预留 1 GiB，并保证各自至少还能分配 1 GiB。
              if (( root_free_kb >= 9 * 1024 * 1024 && temp_free_kb >= 2 * 1024 * 1024 )); then
                maximize=true
              else
                echo "独立文件系统余量不足，沿用原始存储布局"
              fi
            else
              echo "临时文件系统类型不适合扩容，沿用原始存储布局"
            fi
          else
            echo "未同时满足独立文件系统和 overlay2 存储条件，跳过磁盘合并"
          fi
        else
          echo "/mnt 不存在，沿用原始存储布局"
        fi
        echo "maximize=$maximize" >> "$GITHUB_OUTPUT"

    # 仅在独立文件系统和已验证的 overlay2 存储条件下合并空间。
    - name: Maximize build space
      if: ${{ steps.disk.outputs.maximize == 'true' }}
      uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
      with:

        root-reserve-mb: 8192
        temp-reserve-mb: 1024
        swap-size-mb: 128
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      if: ${{ steps.disk.outputs.maximize == 'true' }}
      run: sudo service docker restart

    - name: 核验实际磁盘余量
      run: |
        set -euo pipefail
        root_free_kb=$(df -k --output=avail / | awk 'NR == 2 {print $1}')
        if [[ ! "$root_free_kb" =~ ^[0-9]+$ ]]; then
          echo "::error::无法读取根分区可用空间，停止运行"
          exit 1
        fi
        if (( root_free_kb < 8 * 1024 * 1024 )); then
          echo "::error::根分区实际可用空间不足 8 GiB，停止镜像转存"
          exit 1
        fi
        docker info --format 'DockerRootDir={{.DockerRootDir}} StorageDriver={{.Driver}}'
        df -hT /
        for storage_path in /var/lib/docker /var/lib/containerd; do
          if [[ -d "$storage_path" ]]; then
            df -hT "$storage_path"
          fi
        done
        df -i /

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            echo "image $image"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
        
            echo "docker pull $line"
            docker pull $line
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            # 如果存在架构信息 将架构信息拼到镜像名称前面
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')

            # 获取 镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名例  例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            # 将@sha256:等字符删除
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            echo "docker tag $image $new_image"
            docker tag $image $new_image
            echo "docker push $new_image"
            docker push $new_image
            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi $image
            docker rmi $new_image
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="     
            
        done < images.txt
