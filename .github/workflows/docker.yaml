name: 验证磁盘布局与只读拉取

on:
  workflow_dispatch:
  push:
    branches: [ verify/disk-layout-20261103 ]


permissions:
  contents: read

jobs:

  build:
    name: Pull
    runs-on: ubuntu-24.04
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: 清理原有配置中不需要的软件
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /opt/ghc

    - name: 检查磁盘布局
      id: disk
      run: |
        set -euo pipefail
        root_device=$(stat -c %d /)
        if [[ ! "$root_device" =~ ^[0-9]+$ ]]; then
          echo "::error::无法识别根文件系统，停止运行"
          exit 1
        fi
        maximize=false
        if [[ -d /mnt ]]; then
          temp_device=$(stat -c %d /mnt)
          if [[ ! "$temp_device" =~ ^[0-9]+$ ]]; then
            echo "::error::无法识别临时文件系统，停止运行"
            exit 1
          fi
          if [[ "$root_device" != "$temp_device" ]]; then
            temp_type=$(findmnt -n -o FSTYPE --target /mnt)
            if [[ "$temp_type" == ext4 || "$temp_type" == xfs ]]; then
              root_free_kb=$(df -k --output=avail / | awk 'NR == 2 {print $1}')
              temp_free_kb=$(df -k --output=avail /mnt | awk 'NR == 2 {print $1}')
              if [[ ! "$root_free_kb" =~ ^[0-9]+$ || ! "$temp_free_kb" =~ ^[0-9]+$ ]]; then
                echo "::error::无法读取磁盘可用空间，停止运行"
                exit 1
              fi
              # 根分区预留 8 GiB，临时分区预留 1 GiB，并保证各自至少还能分配 1 GiB。
              if (( root_free_kb >= 9 * 1024 * 1024 && temp_free_kb >= 2 * 1024 * 1024 )); then
                maximize=true
              else
                echo "独立文件系统余量不足，沿用原始存储布局"
              fi
            else
              echo "临时文件系统类型不适合扩容，沿用原始存储布局"
            fi
          else
            echo "根目录与 /mnt 共用文件系统，跳过磁盘合并"
          fi
        else
          echo "/mnt 不存在，沿用原始存储布局"
        fi
        echo "maximize=$maximize" >> "$GITHUB_OUTPUT"

    # 仅在两个目录确实使用独立文件系统时合并空间。
    - name: Maximize build space
      if: ${{ steps.disk.outputs.maximize == 'true' }}
      uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
      with:

        root-reserve-mb: 8192
        temp-reserve-mb: 1024
        swap-size-mb: 128
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      if: ${{ steps.disk.outputs.maximize == 'true' }}
      run: sudo service docker restart

    - name: 核验实际磁盘余量
      run: |
        set -euo pipefail
        root_free_kb=$(df -k --output=avail / | awk 'NR == 2 {print $1}')
        if [[ ! "$root_free_kb" =~ ^[0-9]+$ ]]; then
          echo "::error::无法读取根分区可用空间，停止运行"
          exit 1
        fi
        if (( root_free_kb < 8 * 1024 * 1024 )); then
          echo "::error::根分区实际可用空间不足 8 GiB，停止镜像转存"
          exit 1
        fi
        docker info --format 'DockerRootDir={{.DockerRootDir}}'
        df -hT /
        for storage_path in /var/lib/docker /var/lib/containerd; do
          if [[ -d "$storage_path" ]]; then
            df -hT "$storage_path"
          fi
        done
        df -i /

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: 验证 40 GiB 可分配空间
      run: |
        set -euo pipefail
        storage_path=$(docker info --format '{{.DockerRootDir}}')
        root_device=$(stat -c %d /)
        storage_device=$(stat -c %d "$storage_path")
        available_kb=$(df -k --output=avail "$storage_path" | awk 'NR == 2 {print $1}')
        reserve_kb=$((1024 * 1024))
        if [[ "$root_device" == "$storage_device" ]]; then
          reserve_kb=$((8 * 1024 * 1024))
        fi
        if [[ ! "$available_kb" =~ ^[0-9]+$ ]] || (( available_kb < 40 * 1024 * 1024 + reserve_kb )); then
          echo "::error::无法在保留系统余量的同时验证 40 GiB 容量"
          exit 1
        fi
        probe_file=$(sudo mktemp "$storage_path/.disk-capacity-check.XXXXXX")
        trap 'sudo rm -f "$probe_file"' EXIT
        sudo fallocate -l "$((40 * 1024 * 1024 * 1024))" "$probe_file"
        sudo stat -c '容量测试文件：逻辑字节=%s 分配块数=%b 每块字节=%B' "$probe_file"
        df -hT / "$storage_path"
        root_free_kb=$(df -k --output=avail / | awk 'NR == 2 {print $1}')
        if (( root_free_kb < 8 * 1024 * 1024 )); then
          echo "::error::容量测试期间根分区可用空间不足 8 GiB"
          exit 1
        fi
        sudo rm -f "$probe_file"
        trap - EXIT
        echo "40 GiB 容量分配及清理通过"
        df -hT / "$storage_path"

    - name: 只读拉取清单并核对架构
      run: |
        set -euo pipefail
        sample_file="$RUNNER_TEMP/root-space-samples-kb.txt"
        while true; do
          df -k --output=avail / | awk 'NR == 2 {print $1}' >> "$sample_file"
          sleep 1
        done &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        count=0
        while IFS= read -r line || [[ -n "$line" ]]; do
          [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
          root_free_kb=$(df -k --output=avail / | awk 'NR == 2 {print $1}')
          if (( root_free_kb < 8 * 1024 * 1024 )); then
            echo "::error::拉取前根分区可用空间不足 8 GiB"
            exit 1
          fi
          echo "验证拉取：$line"
          docker pull $line
          image=$(echo "$line" | awk '{print $NF}')
          expected_platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
          expected_platform="${expected_platform:-linux/amd64}"
          actual_platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
          if [[ "$actual_platform" != "$expected_platform" ]]; then
            echo "::error::镜像架构不符：$image，预期 $expected_platform，实际 $actual_platform"
            exit 1
          fi
          echo "架构核对通过：$image $actual_platform"
          df -hT /
          docker image rm "$image"
          count=$((count + 1))
        done < images.txt
        kill "$monitor_pid" 2>/dev/null || true
        wait "$monitor_pid" 2>/dev/null || true
        trap - EXIT
        minimum_kb=$(sort -n "$sample_file" | head -n 1)
        echo "验证完成：共 $count 个镜像，根分区采样最低可用空间为 $minimum_kb KiB"
        if (( minimum_kb < 8 * 1024 * 1024 )); then
          echo "::error::拉取期间根分区可用空间低于 8 GiB"
          exit 1
        fi
        df -hT /
